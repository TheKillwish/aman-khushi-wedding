<section class="gallery-section" id="gallery">

  <div class="gallery-heading">
    <p class="eyebrow">Little moments, lasting memories</p>

    <h2 class="section-title">
      The beginning of <em>forever.</em>
    </h2>

    <p class="section-copy">
      A glimpse into our favourite moments.
      Six memories, one beautiful beginning.
    </p>
  </div>

  <div class="gallery-grid">

    @for (photo of photos; track photo) {
      <button
        class="gallery-tile tile-{{photo}}"
        type="button"
        (click)="openPhoto(photo)"
        [attr.aria-label]="'Open gallery photo ' + photo"
      >
        <img
          [src]="'assets/images/engagement/photo-' + photo + '.jpg'"
          [alt]="'Aman and Khushi - Memory ' + photo"
          loading="lazy"
        />

        <span class="zoom">↗</span>
      </button>
    }

  </div>

  @if (activePhoto !== null) {
    <div
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
      (click)="closePhoto()"
    >

      <button
        class="close"
        type="button"
        aria-label="Close"
        (click)="closePhoto()"
      >×</button>

      <button
        class="previous"
        type="button"
        aria-label="Previous photo"
        (click)="$event.stopPropagation(); showPrevious()"
      >‹</button>

      <div
        class="lightbox-photo"
        (click)="$event.stopPropagation()"
      >
        <img
          [src]="'assets/images/engagement/photo-' + activePhoto + '.jpg'"
          [alt]="'Aman and Khushi - Memory ' + activePhoto"
        />
      </div>

      <button
        class="next"
        type="button"
        aria-label="Next photo"
        (click)="$event.stopPropagation(); showNext()"
      >›</button>

      <p class="photo-count">
        {{ activePhoto }} / {{ photos.length }}
      </p>

    </div>
  }

</section>
